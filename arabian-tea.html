<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arabian Tea (New Addition) — Gabby's Boutique Hotel & Lounge</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    .food-grid .tray-note {
      grid-column: 1 / -1;
      justify-self: center;
      margin-bottom: .6rem !important;
    }

    .back-btn {
      display: inline-block;
      margin: .3rem auto 1.2rem;
      padding: .6rem 1.2rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      font-size: .95rem;
      background:
        linear-gradient(180deg, #fcd630 0%, #8f5d10 55%, #c6901e 100%) padding-box,
        linear-gradient(180deg, rgba(0,0,0,0.65), rgba(208,176,54,.45) 55%, rgba(140,106,19,.45)) border-box;
      border: 1px solid transparent;
      color: #000000;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 6px 16px rgba(0,0,0,.45);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 10px 20px rgba(0,0,0,.55);
    }

    .back-btn:active {
      transform: scale(.985);
      box-shadow: inset 0 -2px 0 rgba(208,176,54,.45), 0 6px 12px rgba(0,0,0,.45);
    }

    @media (min-width: 900px) {
      .grid-center { grid-column: 2; }
      body.drinks .food-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

<body class="drinks arabian-tea">
  <!-- Hero -->
  <header class="hero animate__animated animate__fadeInDown" role="banner">
    <img src="images/gabby-logo.png" alt="Gabby's Boutique Hotel & Lounge" class="logo" />
    <p class="tagline gold-text">Serene Luxury, Private Bliss</p>
  </header>

  <!-- Page Title -->
  <div class="menu-title" aria-label="Menu">
    <h2 class="gold-text">ARABIAN TEA (NEW ADDITION)</h2>
    <span class="menu-underline" aria-hidden="true"></span>
  </div>

  <main role="main">
    <div class="food-grid">
      <!-- Cleanser -->
      <article class="food-card grid-center">
        <img src="images/cleanser.jpg" alt="Cleanser" />
        <div class="food-info">
          <h4 class="food-name gold-text">Cleanser</h4>
          <p class="food-price gold-text">₦10,000</p>
        </div>
      </article>

      <!-- Abido shaker -->
      <article class="food-card">
        <img src="images/abido-shaker.jpg" alt="Abido shaker" />
        <div class="food-info">
          <h4 class="food-name gold-text">Abido shaker</h4>
          <p class="food-price gold-text">₦13,000</p>
        </div>
      </article>

      <!-- Double Double -->
      <article class="food-card">
        <img src="images/double-double.jpg" alt="Double Double (Premium)" />
        <div class="food-info">
          <h4 class="food-name gold-text">Double Double (Premium)</h4>
          <p class="food-price gold-text">₦15,000</p>
        </div>
      </article>

      <!-- Palm Wine (NEW ADDITION) -->
      <article class="food-card">
        <img src="images/palm-wine.jpg" alt="Palm Wine" />
        <div class="food-info">
          <h4 class="food-name gold-text">Palm Wine</h4>
          <p class="food-price gold-text">₦5,000</p>
        </div>
      </article>

      <div class="tray-note">
        Alcohol is served to guests 18+ only — drink responsibly.
      </div>

      <div style="text-align:center; grid-column: 1 / -1;">
        <a href="./drinks.html" class="back-btn">← Back to Drinks</a>
      </div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" aria-label="Primary">
    <a href="./index.html">Home</a>
    <a href="./food.html">Food</a>
    <a href="./drinks.html" class="active">Drinks</a>
    <a href="./rooms.html">Rooms</a>
    <a href="./contact.html">Contact</a>
  </nav>
</body>
</html>
